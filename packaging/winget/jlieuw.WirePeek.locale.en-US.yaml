ShortDescription: Lightweight, Fiddler-like HTTP(S) capture proxy with a live web UI.
Description: |-
  WirePeek runs a local man-in-the-middle proxy and shows every outgoing HTTP(S) request in a
  live web UI: where it is going, full headers, and decoded request/response bodies.
  HTTPS is decrypted with a locally generated root CA that you explicitly trust for your user
  only. Use it only on machines you own, to inspect your own traffic.
